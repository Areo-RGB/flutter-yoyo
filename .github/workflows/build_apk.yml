name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom Release Notes'
        required: false
        default: 'Automated release build'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${github.ref_name}"
          else
            # Extract version from pubspec.yaml if not triggered by tag
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
            TAG_NAME="v${PUBSPEC_VER}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building release for tag: ${TAG_NAME}"

      - name: Prepare APK Asset
        run: |
          mkdir -p build/release_assets
          cp build/app/outputs/flutter-apk/app-release.apk "build/release_assets/YoYo-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/release_assets/YoYo-latest.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YoYo-APK-${{ steps.version.outputs.tag }}
          path: build/release_assets/YoYo-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ github.event.inputs.release_notes || 'New release version of YoYo IR1 Tracker.' }}
          files: |
            build/release_assets/YoYo-${{ steps.version.outputs.tag }}.apk
            build/release_assets/YoYo-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
